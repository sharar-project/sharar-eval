[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sharar-eval"
version = "0.1.0"
description = "Engine-agnostic HTTP evaluations for local inference servers"
readme = "README.md"
requires-python = "==3.12.*"  # the tested interpreter, as sharar's: uv installs and uses a 3.12
dependencies = [
  "sacrebleu==2.4.3",
  "langdetect==1.0.9",
  "nltk==3.9.1",
  "immutabledict==4.2.1",
  "absl-py==2.1.0",
  "pyarrow==17.0.0",
  "tokenizers>=0.22.2",  # shared with sharar: a floor, not a pin
  "wonderwords==2.2.0",
  "editdistance==0.8.1",
  "jinja2>=3.1.6",  # shared with sharar
]

[project.scripts]
sharar-eval = "evals.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2"]  # uv sync installs it; an install as a dependency does not

[tool.setuptools.packages.find]
include = ["evals*"]

[tool.setuptools.package-data]  # evals/suite.py SHIPPED hashes the same files
evals = ["datasets.sha256", "workloads/*.json"]
"evals.speed" = ["data/*"]
