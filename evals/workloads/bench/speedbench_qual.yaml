# sharar-eval bench: one SPEED-Bench qualitative category (bench-v1), AIPerf's public loader. `sharar-eval bench` runs
# it once per (category, concurrency) with the endpoint, model, dataset (speed_bench_<category>), session count,
# concurrency, sampling seed and artifact directory in the environment. A session is one of the category's 80
# conversations, its turns in order with the server's own replies kept (multi-turn rows are sessions, so the count is
# sessions, not requests). AIPerf fetches the rows the published files mask from their sources; that needs a Hugging
# Face login whose account accepted cais/hle's terms, and about 40 GB of downloads on first use.
# Requests: greedy, thinking off, natural stops capped at 4,096 tokens, as SPEED-Bench's own runs.
schemaVersion: "2.0"
randomSeed: ${BENCH_SEED}  # per cell (sharar-eval bench): on a server with no flush endpoint, per run too
benchmark:
  model: ${BENCH_MODEL}
  endpoint:
    url: ${BENCH_URL}/v1/chat/completions
    type: chat
    streaming: true
    timeout: 3600.0
    useServerTokenCount: true
    extra:
      temperature: 0
      max_tokens: 4096  # not max_completion_tokens: every engine accepts this one
      chat_template_kwargs: {enable_thinking: false}
  tokenizer:
    name: ${BENCH_TOKENIZER}
  datasets:
    - name: main
      type: public
      dataset: ${BENCH_DATASET}
      sampling: shuffle  # without replacement: with 80 sessions, every conversation once, in the cell's seeded order
  phases:
    - name: profiling
      type: concurrency
      sessions: ${BENCH_SESSIONS}
      concurrency: ${BENCH_CONCURRENCY}
  artifacts:
    dir: ${BENCH_ARTIFACTS}
    summary: [json]
    records: [jsonl]
